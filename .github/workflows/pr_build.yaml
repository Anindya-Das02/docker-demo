name: "Verify PR Build"

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Build
        run: mvn clean package

  comment-pr:
    needs: verify-pr
    if: always()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Comment result
        run: |
          if [ "${{ needs.verify-pr.result }}" = "success" ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "✅ Build passed successfully!"
          else
            gh pr comment ${{ github.event.pull_request.number }} \
              --repo ${{ github.repository }} \
              --body "❌ Build failed. Please check the logs."
          fi